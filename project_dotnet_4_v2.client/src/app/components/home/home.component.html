<div class="home-container">
  <h1>Available Events</h1>
  <div *ngIf="isLoading" class="loading">
    Loading events...
  </div>
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>
  <div class="events-grid">
    <div *ngFor="let event of events" class="event-card" (click)="viewEventDetails(event.id)">
      <img [src]="event.imageUrl || 'assets/placeholder.jpg'"
           [alt]="event.name"
           class="event-image">
      <div class="event-info">
        <h3>{{ event.name }}</h3>
        <p class="event-date">{{ event.date | date:'MM/dd/yyyy at HH:mm' }}</p>
        <p class="event-description">{{ event.description }}</p>
        <p class="event-price">Starting from ${{ event.basePrice }}</p>
        <button class="btn-reserve">Book Now</button>
      </div>
    </div>
  </div>
</div>
